<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Cascade brand mark.

    Three descending pills: a cascade, and also the thing the product does —
    a change at the top propagating down a dependency chain. Opacity falls off
    with each step so the descent reads as propagation rather than decoration.

    Deliberately monochrome and geometric so it survives 16px in a browser tab,
    inverts cleanly on light backgrounds, and needs no gradient to work.
  -->
  <rect x="4"    y="6"    width="17" height="5" rx="2.5" fill="#3ECFD6"/>
  <rect x="7.5"  y="13.5" width="17" height="5" rx="2.5" fill="#3ECFD6" opacity="0.72"/>
  <rect x="11"   y="21"   width="17" height="5" rx="2.5" fill="#3ECFD6" opacity="0.44"/>
</svg>
